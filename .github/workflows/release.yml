name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Generate SBOM
        run: npm run sbom

      - name: Validate tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) does not match tag ($TAG_NAME)"
            exit 1
          fi

      - name: Verify build artifacts
        run: |
          echo "Verifying dist files exist..."
          if [ ! -f "dist/fili.js" ]; then
            echo "❌ Error: dist/fili.js not found"
            exit 1
          fi
          if [ ! -f "dist/fili.min.js" ]; then
            echo "❌ Error: dist/fili.min.js not found"
            exit 1
          fi
          if [ ! -f "dist/sbom.cdx.json" ]; then
            echo "❌ Error: dist/sbom.cdx.json not found"
            exit 1
          fi
          echo "✅ All build artifacts verified:"
          ls -lh dist/
          echo ""
          echo "Package contents:"
          npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "📝 Publishing using OIDC (Trusted Publishing)..."
            echo "⚠️  If this fails, you need to configure NPM Trusted Publishing:"
            echo "   1. Go to https://www.npmjs.com/package/@kramtoske/fili/access"
            echo "   2. Add GitHub as trusted publisher: Kramtoske/fili.js, workflow: release.yml, environment: release"
            echo "   3. See .github/NPM_TRUSTED_PUBLISHING.md for detailed instructions"
            echo ""
            npm publish --provenance --access public
          else
            echo "📝 Publishing using NPM_TOKEN (traditional authentication)..."
            npm publish --access public
          fi

      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/fili.js \
              dist/fili.min.js \
              dist/sbom.cdx.json \
              --clobber
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --generate-notes \
              dist/fili.js \
              dist/fili.min.js \
              dist/sbom.cdx.json
          fi
