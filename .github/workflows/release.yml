name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate SBOM
        run: npm run sbom

      - name: Validate tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Select npm auth mode
        id: npm-auth
        env:
          AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || '' }}
        run: |
          if [ -n "$AUTH_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using npm token authentication."
          else
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
            echo "Using npm Trusted Publishing (OIDC)."
          fi

      - name: Publish to npm (Token)
        if: steps.npm-auth.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish to npm (Trusted Publishing)
        if: steps.npm-auth.outputs.mode == 'trusted'
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/fili.js \
            dist/fili.min.js \
            dist/sbom.cdx.json
