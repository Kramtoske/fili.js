name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            release_tag:
                description: "Tag to release (example: v2.0.22)"
                required: true
                type: string

permissions:
    contents: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        environment: release

        steps:
            - name: Resolve release tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> "$GITHUB_ENV"
                  else
                    echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
                  fi

            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}

            # ❗ BE registry-url
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org/

            - name: Install deps
              run: npm ci

            - name: Build
              run: npm run build

            - name: Generate SBOM
              run: npm run sbom

            - name: Validate tag matches package.json
              run: |
                  TAG_VERSION="${RELEASE_TAG#v}"
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                    echo "Tag $TAG_VERSION != package.json $PKG_VERSION"
                    exit 1
                  fi

            - name: Show trusted publishing identity
              run: |
                  echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
                  echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
                  echo "RELEASE_TAG=$RELEASE_TAG"
                  echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
                  if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
                    TOKEN_JSON=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
                    OIDC_TOKEN=$(echo "$TOKEN_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.value||'')})")
                    if [ -n "$OIDC_TOKEN" ]; then
                      echo "$OIDC_TOKEN" | node -e "let t='';process.stdin.on('data',c=>t+=c);process.stdin.on('end',()=>{const p=t.trim().split('.')[1];const payload=JSON.parse(Buffer.from(p,'base64url').toString('utf8'));console.log('OIDC sub='+(payload.sub||''));console.log('OIDC job_workflow_ref='+(payload.job_workflow_ref||''));console.log('OIDC repository='+(payload.repository||''));})"
                    fi
                  fi

            - name: Publish to npm (OIDC Trusted Publishing)
              run: npm publish --provenance --access public

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$RELEASE_TAG" \
                    --title "$RELEASE_TAG" \
                    --generate-notes \
                    dist/fili.js \
                    dist/fili.min.js \
                    dist/sbom.cdx.json
