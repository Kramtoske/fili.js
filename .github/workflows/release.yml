name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            release_tag:
                description: "Tag to release (example: v2.0.22)"
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        environment: release

        steps:
            - name: Resolve release tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> "$GITHUB_ENV"
                  else
                    echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
                  fi

            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install deps
              run: npm ci

            - name: Build
              run: npm run build

            - name: Generate SBOM
              run: npm run sbom

            - name: Validate tag matches package.json
              run: |
                  TAG_VERSION="${RELEASE_TAG#v}"
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                    echo "Tag $TAG_VERSION != package.json $PKG_VERSION"
                    exit 1
                  fi

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist-${{ env.RELEASE_TAG }}
                  path: |
                      dist/fili.js
                      dist/fili.min.js
                      dist/sbom.cdx.json

            - name: Create or update GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    gh release upload "$RELEASE_TAG" \
                      dist/fili.js \
                      dist/fili.min.js \
                      dist/sbom.cdx.json \
                      --clobber
                  else
                    gh release create "$RELEASE_TAG" \
                      --title "$RELEASE_TAG" \
                      --generate-notes \
                      dist/fili.js \
                      dist/fili.min.js \
                      dist/sbom.cdx.json
                  fi
