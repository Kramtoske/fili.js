name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate SBOM
        run: npm run sbom

      - name: Validate tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Enforce Trusted Publishing auth path
        run: |
          # setup-node may write npm auth config; remove any token auth so OIDC is used.
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG"
          fi
          npm config delete //registry.npmjs.org/:_authToken || true
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "⚠️ NODE_AUTH_TOKEN is set. Ignoring it for this run; remove repo/environment token for Trusted Publishing."
          fi

      - name: Publish to npm (Trusted Publishing)
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/fili.js \
            dist/fili.min.js \
            dist/sbom.cdx.json
